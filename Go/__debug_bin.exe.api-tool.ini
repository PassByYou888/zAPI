; ============================================================================
; API Hub Runtime Configuration File
; This file is automatically generated by the Z.API_HubTool_Export library on
; first run (if it does not already exist). Modify this file and restart your
; application for changes to take effect.
; ============================================================================

[options]
; ----------------------------------------------------------------------------
; General Options
; ----------------------------------------------------------------------------

; Whether to wait for all prepared C4 clients to be fully connected and
; initialized before API_Prepare_Done returns.
; True  : API_Prepare_Done will block until all clients are ready or timeout.
; False : API_Prepare_Done returns immediately without waiting.
; Default: True
Wait_Connection_ReadyOk=True

; Maximum timeout (in milliseconds) to wait for connections to become ready
; when Wait_Connection_ReadyOk is True.
; After this timeout, API_Prepare_Done returns even if some clients are not
; connected.
; Default: 30000 (30 seconds)
Wait_Connection_Timeout=30000

; Whether to include thread IDs in log messages (via DoStatus).
; In library mode (DLL/shared object), this is forced to False to reduce noise.
; Default: False (library mode) / depends on host application
ShowThreadID=False

; Whether to allow log messages to be printed to the console (stdout/stderr).
; In library mode, this is forced to True for easier debugging.
; Default: True (library mode)
ConsoleOutput=True

; Thread pool size for the IPC (Inter-Process Communication) service.
; Affects the concurrency of TZNet_Server_IPC when handling incoming requests.
; Default: 4
IPC_Serv_ThreadCount=4

; Maximum length (number of messages) of the IPC message queue.
; If exceeded, new messages may be dropped or blocked.
; Default: 4096
IPC_Serv_MaxQueueLength=4096

; Maximum size (in bytes) of a single IPC message.
; Messages exceeding this limit will be rejected to prevent memory exhaustion.
; Default: 32768 (32 KB)
IPC_Serv_MaxMsgSize=32768


[C4-Options]
; ----------------------------------------------------------------------------
; C4 Distributed Service Framework Configuration
; These parameters are passed to C40ReadConfig and control the behaviour of
; the underlying C4 kernel, including service discovery, reconnection, and
; network timeouts.
; ----------------------------------------------------------------------------

; Whether to enable quiet mode for the C4 framework.
; True  : Suppresses most log output (only errors and critical info).
; False : Prints detailed debug information.
; In library mode, this is set to True by default.
Quiet=True

; Health-check interval (in milliseconds) for C4 services and clients.
; Each component will periodically call its SafeCheck method for self-diagnosis.
; Default: 45000 (45 seconds)
SafeCheckTime=45000

; Delay (in seconds) before automatically reconnecting after a physical
; connection loss. Supports floating-point values (e.g., 5.0).
; Default: 5.0
PhysicsReconnectionDelayTime=5

; Debounce delay (in milliseconds) for propagating service info updates to
; the Dispatch (DP) service. Multiple updates within this window are merged
; into a single broadcast to reduce network overhead.
; Default: 1000 (1 second)
UpdateServiceInfoDelayTime=1000

; Idle timeout (in milliseconds) for a PhysicsService (server-side).
; If no communication activity occurs within this period, the connection is
; automatically closed.
; Default: 900000 (15 minutes)
PhysicsServiceTimeout=900000

; Idle timeout (in milliseconds) for a PhysicsTunnel (client-side).
; If no communication activity occurs within this period, the connection is
; automatically closed.
; Default: 900000 (15 minutes)
PhysicsTunnelTimeout=900000

; Threshold (in milliseconds) after which a persistent network failure
; (disconnection) triggers a forced cleanup of the corresponding physical
; tunnel and its associated resources. Prevents zombie connections from
; lingering indefinitely.
; Default: 604800000 (7 days)
KillIDCFaultTimeout=604800000

; Whether to allow each C4 service to use its own subdirectory for storing
; configuration and data files. In library mode, this is forced to False to
; avoid creating extra folders in the working directory.
; Default: False
EnablePerServiceDirectory=False

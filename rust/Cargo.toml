[package]
name = "api_hub_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
libloading = "0.8"
anyhow = "1.0"
ctrlc = "3.4"       # 用于服务端示例捕获 Ctrl+C
rand = "0.8"

[lib]
crate-type = ["lib"]

[[bin]]
name = "api_hub_test"
path = "src/main.rs"

[features]
debug-log = []

# Examples (generated by generate_demos.ps1)
[[example]]
name = "calc_server"
path = "examples/calc_server.rs"


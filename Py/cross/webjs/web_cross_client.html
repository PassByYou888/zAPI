<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Cross Bridge 浏览器调用演示</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { margin: 5px; padding: 8px 16px; }
        #result { margin-top: 20px; background: #f0f0f0; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Cross Bridge 浏览器调用</h2>
    <button onclick="callAdd()">调用 add(10,20)</button>
    <button onclick="callInvSeri()">调用 inv_seri</button>
    <div id="result">等待结果...</div>

    <script>
        const BRIDGE_URL = 'http://127.0.0.1:8081/cross'; // 注意跨域，需同源或配置 CORS

        async function callBridge(api, args = [], timeout = 2000) {
            const resp = await fetch(BRIDGE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ api, args, timeout })
            });
            if (!resp.ok) {
                const text = await resp.text();
                throw new Error(`HTTP ${resp.status}: ${text}`);
            }
            const data = await resp.json();
            if (data.code !== 0) {
                throw new Error(data.error || '未知错误');
            }
            return data.result;
        }

        async function callAdd() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '⏳ 调用 add...';
            try {
                const result = await callBridge('add', [10, 20]);
                resultDiv.textContent = `✅ 10 + 20 = ${result}`;
            } catch (e) {
                resultDiv.textContent = `❌ 错误: ${e.message}`;
            }
        }

        async function callInvSeri() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '⏳ 调用 inv_seri...';
            try {
                const result = await callBridge('inv_seri');
                resultDiv.textContent = `✅ inv_seri 结果: ${result}`;
            } catch (e) {
                resultDiv.textContent = `❌ 错误: ${e.message}`;
            }
        }
    </script>
</body>
</html>
